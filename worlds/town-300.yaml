# A town between the small one and Stage 2's scale (town.yaml one and a half times over): for check runs, where the
# measures of a town matter and its size does not (docs/dev-machine.md).
# `oikos run worlds/town-300.yaml --log lean --record-observations none`
generate: town
name: Millbrook
seed: 1
citizens: 300                # people, in households (docs/behaviour/households.md)
years: 2
grid: { w: 24, h: 15 }
apartment_blocks: 5      # 12 units each: 3 one-bedroom, 7 two, 2 three
houses: 54               # 55% three-bedroom, 45% four (114 homes for about 117 households: housing is tight)
shops: 9                  # 54 jobs
factories: 3              # 120 jobs
landlords: 6
profile: au-vic-2026                           # where its figures come from (worlds/profiles/; docs/profiles.md)
# exports_per_month: (absent) the world market takes what the factories' opening staff make, less the town's own purchases: a boundary condition, set by rule (docs/behaviour/generator.md)
housed_bps: 9500                               # of households
employed_bps: 9500                             # of those in the labour force at the start: about the unemployment rate's complement
savings_months: [1, 6]
landlord_compliance_bps: 5000                  # landlords obey a refusal, fine or order half the time
mayor: code                                    # the all-code control; "llm" puts an AI in the mayor's office
