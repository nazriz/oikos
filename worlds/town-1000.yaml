# The generated town at Stage 2's scale: the same as town.yaml, five times over.
# `terrarium run worlds/town-1000.yaml --seeds 5` (add `--set mayor=llm` for the language-model mayor)
generate: town
name: Millbrook
seed: 1
citizens: 1000                # people, in households (docs/behaviour/households.md)
years: 2
grid: { w: 40, h: 30 }
apartment_blocks: 15      # 12 units each: 3 one-bedroom, 7 two, 2 three
houses: 200               # 55% three-bedroom, 45% four (380 homes for about 400 households: housing is tight)
shops: 30                  # 180 jobs
factories: 10              # 400 jobs
landlords: 20
wages: { shop: 120000, factory: 150000 }       # cents every 14 days
exports_per_month: 200000000                   # $2,000,000 a month bought from the factories
housed_bps: 9500                               # of households
employed_bps: 7800                             # of adults (placeholder near the working-age employment rate)
savings_months: [1, 6]
landlord_compliance_bps: 5000                  # landlords obey a refusal, fine or order half the time
mayor: code                                    # the all-code control; "llm" puts an AI in the seat
