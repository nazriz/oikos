# A small generated town (M1): the all-code control world.
# `oikos run worlds/town.yaml --seeds 5`
generate: town
name: Millbrook
seed: 1
citizens: 200                # people, in households (docs/behaviour/households.md)
years: 2
grid: { w: 20, h: 12 }
apartment_blocks: 3      # 12 units each: 3 one-bedroom, 7 two, 2 three
houses: 38               # 55% three-bedroom, 45% four (74 homes for about 78 households: housing is tight)
shops: 6                  # 36 jobs
factories: 2              # 80 jobs
landlords: 4
profile: au-vic-2026                           # where its figures come from (worlds/profiles/; docs/profiles.md)
# exports_per_month: (absent) the world market takes what the factories' opening staff make, less the town's own purchases: a boundary condition, set by rule (docs/behaviour/generator.md)
housed_bps: 9500                               # of households
employed_bps: 9500                             # of those in the labour force at the start: about the unemployment rate's complement
savings_months: [1, 6]
landlord_compliance_bps: 5000                  # landlords obey a refusal, fine or order half the time
mayor: code                                    # the all-code control; "llm" puts an AI in the mayor's office (M2)
