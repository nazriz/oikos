# An older town: half as many again in every age band from 65 (the rest in proportion). Who lives with whom, who
# works, who draws a pension, who falls ill and dies all follow from the ages by the rules as they are.
id: ageing-town
about: Half as many again of the town's people are 65 or older as the profile's census gives.
bears_on: [clinic-manager, registry, finance, outside-support, mayor]
changes:
  - in: profile
    path: households.age_bands_bps
    where: { field: from, at_least: 65 }
    of: bps
    times_bps: 15000
    basis: >-
      Places differ about this much in their share of people 65 and over: about 29% in Japan against about 18% across
      the OECD (OECD population statistics, 2022; to confirm), and more so between towns within a country.
