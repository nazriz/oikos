# An election due in sixty days with a smaller field of candidates: roughly three to six residents stand
# (vs. 7-17 under the 200 bps default), so the incumbent's record and the leading rival's platform decide the count (PB-10).
id: election-contest
about: The mayor's term ends sixty days in, with a smaller contested field instead of a crowded draw.
bears_on: [mayor, electoral, editor, council-clerk]
changes:
  - in: town
    path: first_election_days
    set: 60
    basis: >-
      Not a size to source: when a term happens to end. Sixty days is the electoral office's own notice period, so the
      election runs its ordinary timetable from the first day (worlds/scenarios/election-due.yaml).
  - in: profile
    path: elections.stand_bps
    set: 85
    basis: >-
      Set for an outcome on a 1,000-person town (about 780 adults): measured across nine seeds (1-5, 7-10) to yield
      1-8 resident challengers (mean 4.33, zero unopposed seeds), down from 7-17 under the 200 bps profile figure (PB-10).
