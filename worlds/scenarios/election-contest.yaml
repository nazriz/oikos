# An election due in sixty days with a smaller field of candidates: two to four residents stand,
# rather than fifteen to twenty, so the incumbent's record and the leading rival's platform decide the count (PB-10).
id: election-contest
about: The mayor's term ends sixty days in, with a small field of two to four candidates instead of a crowded draw.
bears_on: [mayor, electoral, editor, council-clerk]
changes:
  - in: town
    path: first_election_days
    set: 60
    basis: >-
      Not a size to source: when a term happens to end. Sixty days is the electoral office's own notice period, so the
      election runs its ordinary timetable from the first day (worlds/scenarios/election-due.yaml).
  - in: profile
    path: elections.stand_bps
    set: 35
    basis: >-
      Calibrated for a 1,000-person town (about 780 adults) to yield roughly two to four resident candidates under
      voice.rs drive scaling, instead of the 9-26 candidate draw produced by the 200 bps profile figure (PB-10).
