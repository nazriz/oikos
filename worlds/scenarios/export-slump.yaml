# The world wants less of what the town makes: the world market takes 12% less of the factories' goods from the first
# day. What a factory has in hand is not touched: the generator works its opening money out from its wages and inputs
# (its working capital), and no figure of a profile states it.
id: export-slump
about: The world market takes 12% less of the factories' goods from the first day.
bears_on: [mayor, finance, union-organiser, bank-lending, factory managers]
changes:
  - in: town
    path: shocks
    add: { from_day: 0, kind: goods, what: demand, factor_bps: 8800 }
    basis: >-
      The volume of world merchandise trade fell by about 12% in 2009 (World Trade Organization, press release 598,
      March 2010: 12.2%; to confirm). A condition of the world market as the run finds it, not a change during it.
