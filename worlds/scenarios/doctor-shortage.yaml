# Half the doctors: the clinic's establishment is half the profile's for the town's size. Who is seen, how long they
# wait, and what care does are as ever.
id: doctor-shortage
about: The clinic has half the doctors for the town's size that the profile gives.
bears_on: [clinic-manager, mayor, outside-health-funding]
changes:
  - in: profile
    path: health.doctors_per_1000
    times_bps: 5000
    basis: >-
      Rural and remote places have about half the doctors a head of cities, or fewer (United States: about 13
      physicians per 10,000 people in rural areas against about 31 in urban ones, National Rural Health Association;
      to confirm).
