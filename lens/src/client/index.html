<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0b0f17" />
    <title>Lens</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='none' stroke='%23f2b44b' stroke-width='3'/%3E%3Ccircle cx='16' cy='16' r='4.5' fill='%23f2b44b'/%3E%3C/svg%3E" />
    <script>
      // (Before the first paint: the theme a viewer chose, so nothing flashes.)
      try {
        const t = localStorage.getItem("lens.theme");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
