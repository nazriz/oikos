# Pass/fail on every push to main, and nightly, on the self-hosted runner on the run server (Mac mini): both tiers of
# the suite (docs/dev-machine.md). The merge gate (scripts/merge.ts) runs only the gate tier, and only what the change
# reaches; this runs everything, so every assertion runs on every push. Registering the runner: docs/ci-runner.md.
# No pull_request trigger: the repository is public, and a self-hosted runner must not run code from a fork's PR.
name: ci

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * *" # nightly, on main
  workflow_dispatch:

# One run at a time. A push does not cancel the run under way (main's result is what the merge script waits on); a
# newer push replaces one still waiting, since it holds everything the waiting one does.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'schedule' && 'nightly' || github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: [self-hosted, macOS, oikos-mini]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Tools on the PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"; echo "/opt/homebrew/bin" >> "$GITHUB_PATH"; echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
      - run: bun install
      - run: bun install
        working-directory: docs/research/cel-check # its test is typechecked with the rest (scripts/worktree-warm.ts installs it too)
      - run: bun run kernel
      - run: bun run typecheck
      # The gate tier (with the kernel's own tests), then the slow tier: year-long towns, multi-seed and scenario runs.
      - name: Gate tier
        run: bun scripts/test.ts --tier gate --no-build
      - name: Slow tier
        if: ${{ !cancelled() }}
        run: bun scripts/test.ts --tier slow --no-build
      # What the merge script reads: while the latest result on main is a failure, it merges nothing but the fix.
      - name: Record the result for the merge script
        if: ${{ !cancelled() }}
        run: bun scripts/main-status.ts record "$GITHUB_SHA" "${{ job.status }}"
