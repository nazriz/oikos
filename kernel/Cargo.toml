[package]
name = "oikos-kernel"
version = "0.7.0"
edition = "2021"
license = "Apache-2.0"
description = "Oikos world kernel: physics and records, clock, hash-chained log, replay"
rust-version = "1.85"

[lib]
name = "oikos_kernel"
path = "src/lib.rs"

[[bin]]
name = "oikos-kernel"
path = "src/main.rs"

[dependencies]
oikos-core = { path = "crates/core" }
oikos-contracts = { path = "crates/contracts" }
oikos-terms = { path = "crates/terms" }
oikos-time = { path = "crates/time" }
oikos-resolver = { path = "crates/resolver" }
oikos-world = { path = "crates/world" }
oikos-perception = { path = "crates/perception" }
oikos-sight = { path = "crates/sight" }
oikos-actors = { path = "crates/actors" }
oikos-rules = { path = "crates/rules" }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
# Validates every input (config, command, annotation) against the contract
# schemas, which are compiled into the binary.
jsonschema = { workspace = true }
imbl = { version = "7.0.2", features = ["serde"] }
# A faster allocator: the kernel allocates heavily (JSON values, canonical encoding). Results don't depend on it.
# (`no_thp`: it never asks Linux for transparent huge pages, which kept what it had touched resident in 2 MB pieces:
# docs/decisions.md 2026-10-27, "The allocator without huge pages".)
mimalloc = { version = "0.1", default-features = false, features = ["no_thp"] }
# Snapshots and the binary log are compressed (kernel/src/engine/snapshot.rs, kernel/src/blog.rs): zstd, whose output is
# the same for the same input and level.
zstd = { version = "0.13", default-features = false }
rayon = "1.12"

# On ARM (Apple silicon), SHA-256 uses the CPU's SHA instructions (the same hashes, several times faster).
[target.'cfg(target_arch = "aarch64")'.dependencies]
sha2 = { workspace = true, features = ["asm"] }

# The platform core, as a workspace (docs/design/rebuild.md section 4): this crate is the kernel (the only
# writer); crates/ holds what it and every other consumer share.
[workspace]
members = [".", "crates/core", "crates/contracts", "crates/terms", "crates/time", "crates/resolver", "crates/world", "crates/perception", "crates/napi", "crates/law", "crates/nature", "crates/sight", "crates/rules", "crates/actors", "crates/explore"]
resolver = "2"

[workspace.dependencies]
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
sha2 = "0.10"
jsonschema = { version = "0.30", default-features = false }

[dev-dependencies]
proptest = "1"
# The explorer's data layer attaches to a live run through the stream (tests/explore_live.rs); it reads, and the kernel never depends on it.
oikos-explore = { path = "crates/explore" }

[features]
# A sampling heap profiler in the binary (src/heapprof.rs), for measuring memory only.
heapprof = []

[profile.test]
opt-level = 1

# Integer overflow stops a release build as it stops a test build (it wrapped, silently): the same log can't replay to a
# different world by the build that reads it. Arithmetic that could overflow on a participant's input is checked where
# it's done, and refused in the ordinary way.
[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

# The merge gate's build of the kernel's tests (scripts/test.ts, 2026-10-24): release's optimisation and overflow checks,
# without the whole-program link (fat LTO, one codegen unit) that made `cargo test --release` take half an hour for its
# ~50 test programs. The same code and the same checks; the release build itself is unchanged.
# For a heap profile (`--features heapprof`): release, with line tables for naming the stacks.
[profile.heapprof]
inherits = "release"
debug = "line-tables-only"
split-debuginfo = "packed"
lto = "thin"
codegen-units = 16

[profile.gate]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
