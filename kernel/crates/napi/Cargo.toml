[package]
name = "oikos-napi"
version = "0.7.0"
edition = "2021"
license = "Apache-2.0"
description = "The engine inside the participant host's process (N-API), with the same requests and replies as the stdio protocol"
rust-version = "1.85"

[lib]
crate-type = ["cdylib"]

[dependencies]
oikos-kernel = { path = "../.." }
napi = { version = "3", default-features = false, features = ["napi4"] }
napi-derive = "3"
serde_json = { workspace = true }
mimalloc = { version = "0.1", default-features = false }

[build-dependencies]
napi-build = "2"
