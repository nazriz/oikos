[package]
name = "oikos-contracts"
version = "0.7.0"
edition = "2021"
license = "Apache-2.0"
description = "Oikos's contract types (blocks, records, world config, events) and the compiled schemas"
rust-version = "1.85"

[dependencies]
oikos-core = { path = "../core" }
serde = { workspace = true }
serde_json = { workspace = true }
jsonschema = { workspace = true }
sha2 = { workspace = true }
# A config's canonical bytes are kept compressed (config::Canonical): a large world's are over a gigabyte.
zstd = { version = "0.13", default-features = false }
