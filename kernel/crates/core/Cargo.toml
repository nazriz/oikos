[package]
name = "terrarium-core"
version = "0.7.0"
edition = "2021"
license = "Apache-2.0"
description = "Terrarium's shared core: canonical JSON and hashing, money, keyed randomness"
rust-version = "1.85"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }

[target.'cfg(target_arch = "aarch64")'.dependencies]
sha2 = { workspace = true, features = ["asm"] }
