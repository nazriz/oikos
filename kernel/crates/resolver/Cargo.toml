[package]
name = "oikos-resolver"
version = "0.7.0"
edition = "2021"
license = "Apache-2.0"
description = "The resolver: a call (the call language) to a seat's own acts, from what the seat knows (docs/design/translator-and-resolver.md section 8)."
rust-version = "1.85"

[dependencies]
serde_json = { workspace = true }
# A persistent map: a town's register of lots, known to every seat that has read it, is held once between them.
imbl = { version = "7.0.2", features = ["serde"] }
# What a seat knows is saved with a snapshot (kernel/src/snapshot.rs).
serde = { workspace = true }
