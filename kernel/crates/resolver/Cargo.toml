[package]
name = "oikos-resolver"
version = "0.7.0"
edition = "2021"
license = "Apache-2.0"
description = "The resolver: a call (the call language) to a seat's own acts, from what the seat knows (docs/design/translator-and-resolver.md section 8)."
rust-version = "1.85"

[dependencies]
serde_json = { workspace = true }
# The world's calendar and the words its dates are written in (docs/design/names-and-dates.md section 5).
oikos-rules = { path = "../rules" }
# A persistent map: a town's register of lots, known to every seat that has read it, is held once between them.
imbl = "7.0.2"
